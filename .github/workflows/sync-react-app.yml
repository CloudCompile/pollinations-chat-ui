name: Sync React App to Pollinations

on:
  push:
    branches:
      - main
    paths:
      - 'react-app/**'
      - '.github/workflows/sync-react-app.yml'
  workflow_dispatch:

concurrency:
  group: sync-react-app
  cancel-in-progress: true

jobs:
  sync-react-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone fork and sync with upstream
        env:
          GH_TOKEN: ${{ secrets.CLOUDCOMPILE_POLLINATIONS_FORK_KEY }}
        run: |
          git clone "https://oauth2:${GH_TOKEN}@github.com/CloudCompile/Pollinations.git" dest-repo
          cd dest-repo
          git remote add upstream https://github.com/pollinations/pollinations.git
          git fetch upstream main
          git checkout -B main upstream/main

      - name: Verify source directory
        run: |
          if [ ! -d "react-app" ]; then
            echo "Error: react-app directory not found"
            exit 1
          fi
          echo "Source react-app directory found"

      - name: Prepare destination directory
        run: |
          DEST_DIR="dest-repo/apps/chat"
          mkdir -p "$DEST_DIR"
          find "$DEST_DIR" -mindepth 1 -delete
          echo "Destination directory prepared"

      - name: Copy react-app to destination
        run: |
          cp -r react-app/* dest-repo/apps/chat/
          echo "Copy complete"

      - name: Update vite configuration
        run: |
          VITE_CONFIG="dest-repo/apps/chat/vite.config.js"
          if [ -f "$VITE_CONFIG" ] && grep -q "base: '/pollinations-chat-ui/'" "$VITE_CONFIG"; then
            sed -i "s|base: '/pollinations-chat-ui/'|base: '/'|" "$VITE_CONFIG"
            echo "Updated vite base path to '/'"
          fi

      - name: Check for changes
        id: check_changes
        run: |
          cd dest-repo
          git add apps/chat/
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --cached --stat
          fi

      - name: Create commit, push, and open PR
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.CLOUDCOMPILE_POLLINATIONS_FORK_KEY }}
        run: |
          cd dest-repo

          BRANCH_NAME="sync/react-app-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          git commit -m "Sync: Update React App from pollinations-chat-ui"

          git push origin "$BRANCH_NAME"

          gh pr create \
            --repo pollinations/pollinations \
            --title "Sync: React Chat App from pollinations-chat-ui" \
            --body "Automated sync of latest changes from pollinations-chat-ui/react-app to apps/chat." \
            --head "CloudCompile:${BRANCH_NAME}" \
            --base main || {
            echo "PR creation failed or already exists"
            exit 0
          }

          echo "PR created successfully"

      - name: Summary
        run: |
          echo "## Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Source: pollinations-chat-ui/react-app" >> $GITHUB_STEP_SUMMARY
          echo "- Fork: CloudCompile/Pollinations" >> $GITHUB_STEP_SUMMARY
          echo "- Destination PR: pollinations/pollinations/apps/chat" >> $GITHUB_STEP_SUMMARY
          echo "- Changes: ${{ steps.check_changes.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
